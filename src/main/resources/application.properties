server.port=8080
spring.application.name=clinical-patient-index

# ============ 安全：API Key -> 角色 / 来源系统白名单 ============
# 本地开发默认密钥，生产/演示请通过环境变量覆盖：CPI_SECURITY_CLIENTS_...
cpi.security.enabled=true
cpi.security.clients.ingest-his-key.roles[0]=INGEST
cpi.security.clients.ingest-his-key.systems[0]=HIS
cpi.security.clients.ingest-lab-key.roles[0]=INGEST
cpi.security.clients.ingest-lab-key.systems[0]=LIS
cpi.security.clients.query-key.roles[0]=QUERY
cpi.security.clients.audit-key.roles[0]=AUDIT_READ
cpi.security.clients.admin-key.roles[0]=INGEST
cpi.security.clients.admin-key.roles[1]=QUERY
cpi.security.clients.admin-key.roles[2]=AUDIT_READ

# ============ 标识符归一规则 ============
# 来源系统别名（值统一为大写后的规范名）
cpi.identifier.system-aliases.EMR=HIS
cpi.identifier.system-aliases.HOSPITAL_A=HIS
cpi.identifier.system-aliases.LAB=LIS
cpi.identifier.max-length=64
cpi.identifier.strip-prefixes[0]=MRN
cpi.identifier.strip-prefixes[1]=MR

# ============ 去标识化 ============
cpi.deidentification.secret=${CPI_PSEUDONYM_SECRET:local-development-secret-change-me}

# ============ 审计 ============
cpi.audit.in-memory-capacity=10000
