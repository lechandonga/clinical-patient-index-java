# 随机端口便于测试；本地联调可改为固定端口（如 8080）
server.port=${SERVER_PORT:0}

# 去标识化 HMAC 密钥：默认值仅供本地验证，生产部署必须通过环境变量覆盖
mpi.pseudonym-secret=${MPI_PSEUDONYM_SECRET:local-development-secret-change-me}

# 追加自定义令牌，格式：令牌=用户名,scope1,scope2;...
# scope 取值：patient:ingest / patient:query / audit:read
mpi.tokens=${MPI_TOKENS:}
